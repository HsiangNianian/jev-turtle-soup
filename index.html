<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe6" />
    <!--build:meta-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--meta:start-->
    <title>海龟汤调查局 · 情境推理</title>
    <meta name="description" content="向主持人砚（Ellis）提出是非问题，一步步还原被隐去的真相。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="海龟汤调查局" />
    <meta property="og:title" content="海龟汤调查局 · 情境推理" />
    <meta
      property="og:description"
      content="向主持人砚（Ellis）提出是非问题，一步步还原被隐去的真相。"
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <!--meta:end-->
    <!--
      字体 CSS 不阻塞首屏：它是跨域请求，放在 head 里会让白屏一直等到
      Google 回话。改成 preload + onload 换成 stylesheet，页面先用系统字体画出来，
      字体到了再换（字体本身已经是 display=swap，本来就不会挡文字）。
      关掉 JS 的人走下面的 noscript 分支。
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Noto+Serif+SC:wght@400..900&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Noto+Serif+SC:wght@400..900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 页面可能是缓存的旧 HTML，引用的 JS 已被新部署替换掉：
      // 模块会 404（被 SPA 兜底当成 HTML 返回）→ 整页空白。
      // 这里检测到就强制重载一次拿新哈希，最多一次，避免死循环。
      ;(function () {
        var KEY = 'ts-asset-recovery'

        // 整个 bundle 解析失败时，只有这段内联脚本还活着 —— 所以上报也放在这里。
        // （bundle 里的上报钩子在这种情况下根本没机会执行。）
        function report(message) {
          try {
            var meta = document.querySelector('meta[name="build"]')
            fetch('/api/errors', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              keepalive: true,
              body: JSON.stringify({
                message: message,
                path: location.pathname,
                buildId: meta ? meta.getAttribute('content') : '',
                source: 'recovery',
              }),
            }).catch(function () {})
          } catch (error) {
            /* 上报失败就算了 */
          }
        }

        function recover() {
          report('bundle 没能启动，正在重载一次')
          try {
            if (sessionStorage.getItem(KEY) === '1') return
            sessionStorage.setItem(KEY, '1')
          } catch (error) {
            /* 隐私模式：仍然重载一次 */
          }
          location.reload()
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) recover()
          },
          true,
        )
        window.setTimeout(function () {
          if (!window.__tsBooted) recover()
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

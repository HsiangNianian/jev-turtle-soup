<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="海龟汤" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--build:meta-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--meta:start-->
    <title>海龟汤调查局 · 情境推理</title>
    <meta
      name="description"
      content="汤友写汤，砚代主持。发现原创海龟汤，提出是非问题，一起还原真相。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="海龟汤调查局" />
    <meta property="og:title" content="海龟汤调查局 · 情境推理" />
    <meta
      property="og:description"
      content="汤友写汤，砚代主持。发现原创海龟汤，提出是非问题，一起还原真相。"
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <!--meta:end-->
    <!--
      字体 CSS 不阻塞首屏：它是跨域请求，放在 head 里会让白屏一直等到
      Google 回话。改成 preload + onload 换成 stylesheet，页面先用系统字体画出来，
      字体到了再换（字体本身已经是 display=swap，本来就不会挡文字）。
      关掉 JS 的人走下面的 noscript 分支。
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Noto+Serif+SC:wght@400..900&display=swap"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Noto+Serif+SC:wght@400..900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Runs before the app bundle, including when that bundle cannot be loaded.
      ;(function () {
        var KEY = 'ts-asset-recovery:v2'
        var NOTICE = 'ts-loading-notice'
        var handled = false
        var pending = false

        function assetPath(value) {
          try {
            var url = new URL(value, location.href)
            if (url.origin === location.origin && /^\/(assets\/|src\/)/.test(url.pathname)) {
              return url.pathname
            }
          } catch (error) {}
          return ''
        }

        function hideNotice() {
          var notice = document.getElementById(NOTICE)
          if (notice) notice.remove()
        }

        function showNotice(slow) {
          if (document.getElementById(NOTICE)) return
          var lang = document.documentElement.lang || navigator.language || 'zh-CN'
          try {
            lang = localStorage.getItem('turtle-soup.locale') || lang
          } catch (error) {}
          var copy =
            lang.indexOf('ja') === 0
              ? [
                  '読み込みに時間がかかっています。',
                  'ページを読み込めませんでした。',
                  '通信を確認してください。未保存の内容があれば控えてから再読み込みしてください。',
                  '再読み込み',
                ]
              : lang.indexOf('en') === 0
                ? [
                    'This is taking a little longer to load.',
                    'This page could not finish loading.',
                    'Check your connection. Keep a copy of any unsaved work before reloading.',
                    'Reload',
                  ]
                : [
                    '页面还在加载，请稍等。',
                    '页面资源没能加载完成。',
                    '请检查网络；如有尚未保存的内容，请先保留，再重新加载。',
                    '重新加载',
                  ]
          var notice = document.createElement('div')
          notice.id = NOTICE
          notice.setAttribute('role', 'alert')
          notice.style.cssText =
            'position:fixed;bottom:16px;left:16px;right:16px;z-index:100;background:#f2efe6;color:#1a1812;border:1px solid #1a1812;padding:16px;font:14px/1.7 serif;box-shadow:0 4px 20px #0002'
          var title = document.createElement('strong')
          title.textContent = copy[slow ? 0 : 1]
          var detail = document.createElement('p')
          detail.textContent = copy[2]
          var button = document.createElement('button')
          button.type = 'button'
          button.textContent = copy[3]
          button.style.cssText =
            'padding:6px 16px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer'
          button.onclick = function () {
            location.reload()
          }
          notice.appendChild(title)
          notice.appendChild(detail)
          notice.appendChild(button)
          document.body.appendChild(notice)
        }

        function tryReload() {
          if (!navigator.onLine || (window.__tsCanReload && !window.__tsCanReload())) return false
          try {
            var last = Number(sessionStorage.getItem(KEY))
            if (last && Date.now() - last < 60000) return false
            // Do not clear this on boot: a failing resource must not cause a reload loop.
            sessionStorage.setItem(KEY, String(Date.now()))
          } catch (error) {
            // Without a persistent guard, offer a manual retry instead of an endless refresh.
            return false
          }
          location.reload()
          return true
        }

        function recover(message, resource) {
          if (handled) return
          handled = true
          pending = true
          try {
            var meta = document.querySelector('meta[name="build"]')
            fetch('/api/errors', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              keepalive: true,
              body: JSON.stringify({
                message: message,
                stack:
                  'resource=' +
                  (resource || 'unknown') +
                  '; booted=' +
                  !!window.__tsBooted +
                  '; online=' +
                  navigator.onLine,
                path: location.pathname,
                buildId: meta ? meta.getAttribute('content') : '',
                source: 'recovery',
              }),
            }).catch(function () {})
          } catch (error) {}
          if (!tryReload()) showNotice(false)
        }

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target
            var resource = el && el.tagName === 'SCRIPT' ? assetPath(el.src) : ''
            // Extensions and third-party scripts cannot trigger application recovery.
            if (resource) recover('应用入口资源加载失败', resource)
          },
          true,
        )

        window.addEventListener('vite:preloadError', function (event) {
          var error = event.payload
          var message = error && error.message ? error.message : String(error)
          if (
            !/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|Unable to preload CSS/i.test(
              message,
            )
          )
            return
          window.__tsAssetError = error
          var match = message.match(/https?:\/\/[^\s'"<>]+/)
          recover('页面模块加载失败', match ? assetPath(match[0]) : '')
          // Leave the rejection intact so React can show its fallback if recovery is blocked.
        })

        window.addEventListener('online', function () {
          if (pending) tryReload()
        })
        window.addEventListener('turtle-soup:booted', function () {
          pending = false
          hideNotice()
        })
        window.setTimeout(function () {
          // A slow connection is not proof of failure. Never interrupt a download or report it as a crash.
          if (!window.__tsBooted) showNotice(true)
        }, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Mobile checks
on:
  pull_request:
  push:
    branches: [main, 'codex/mobile-app']
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Resolve and export initial CocoaPods / Ruby lockfiles
        type: boolean
        default: false
      platform:
        description: Native build to run (checks always run)
        type: choice
        options: [both, android, ios]
        default: both
      reuse_native_run:
        description: Optional completed run ID; rerun smoke only if application sources are unchanged
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  EXPO_NO_TELEMETRY: '1'
  MOBILE_ENV: development
  EXPO_PUBLIC_API_URL: http://127.0.0.1:8787
  MOBILE_BUILD_NUMBER: ${{ github.run_number }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run mobile:check
      - run: npm run lint
      - run: npm run build
      - run: npm run deploy:dry-run
      - run: npm run mobile:export
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            package-lock.json
      - run: npm ci
      - name: Reuse unchanged Android package for smoke rerun
        if: inputs.reuse_native_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_native_run }}
        run: node scripts/mobile/reuse-native.mjs android "$REUSE_RUN"
      - run: npm run mobile:build:android:emulator -- --architectures arm64-v8a,x86_64
        if: inputs.reuse_native_run == ''
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play and recover on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: npm run mobile:smoke:android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-emulator-${{ github.sha }}
          path: |
            artifacts/mobile/*.apk
            artifacts/mobile/*.json
            artifacts/mobile/*.sha256
            artifacts/mobile/smoke/*
          if-no-files-found: error
          retention-days: 14
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.2'
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
        if: inputs.reuse_native_run == ''
        with:
          ruby-version: '3.3.12'
          working-directory: mobile
          bundler-cache: true
      - run: npm ci
      - name: Reuse unchanged iOS package for smoke rerun
        if: inputs.reuse_native_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_native_run }}
        run: node scripts/mobile/reuse-native.mjs ios "$REUSE_RUN"
      - name: Compile simulator app
        if: inputs.reuse_native_run == ''
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          if [ "$BOOTSTRAP" = true ]; then
            echo "::warning::Initializing native locks; download and commit them before treating the build as reproducible."
            npm run mobile:build:ios:simulator -- --bootstrap
          else
            npm run mobile:build:ios:simulator
          fi
      - name: Launch bundled app on iOS simulator
        run: npm run mobile:smoke:ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-simulator-${{ github.sha }}
          path: |
            artifacts/mobile/*.zip
            artifacts/mobile/*.json
            artifacts/mobile/*.sha256
            mobile/ios/Podfile.lock
            mobile/Gemfile.lock
            artifacts/mobile/smoke/*
          retention-days: 14
  required:
    if: always()
    needs: [checks, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(j=>!["success","skipped"].includes(j.result)))process.exit(1)'
